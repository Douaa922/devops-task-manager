name: CI Pipeline — DevOps Task Manager

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:

  backend-ci:
    name: 🔧 Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🔍 Lint
        run: npm run lint
      - name: 🧪 Tests
        run: npm test -- --coverage --forceExit
      - name: 📤 Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/

  frontend-ci:
    name: 🎨 Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🔍 Lint
        run: npm run lint
      - name: 🏗️ Build
        run: npm run build

  sonarcloud:
    name: 🔬 SonarCloud
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 📥 Download coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
      - name: 🔬 SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security-audit:
    name: 🛡️ Security Audit
    runs-on: ubuntu-latest
    needs: [backend-ci]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 🛡️ npm audit backend
        working-directory: backend
        run: npm audit --audit-level=critical
      - name: 🛡️ npm audit frontend
        working-directory: frontend
        run: npm audit --audit-level=critical

  docker-build-push:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [sonarcloud, security-audit]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      - name: 🔐 Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: 🏗️ Setup Buildx
        uses: docker/setup-buildx-action@v3
      - name: 🐳 Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/task-manager-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/task-manager-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 🐳 Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/task-manager-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/task-manager-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    name: 🔒 Trivy Scan
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    steps:
      - name: 🔒 Scan Backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/task-manager-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
      - name: 🔒 Scan Frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/task-manager-frontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
